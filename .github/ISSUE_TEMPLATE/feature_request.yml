name: Feature request
description: A new source, tool, location or improvement
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need
      description: The problem or use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Data source
      description: For a new source, its API, licence and whether it needs a key.
