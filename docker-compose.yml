services:
  mcp-weather:
    build: .
    image: mcp-weather:latest
    container_name: mcp-weather
    env_file:
      - .env
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:3015:3000"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    # a single Node process serves all clients
    mem_limit: 512m
    networks:
      - mcp-network

networks:
  mcp-network:
    external: true
